<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
/>

<meta name="theme-color" content="#0d0d11">

<meta
    name="description"
    content="Extract and translate text from images using OCR."
>

<meta
    property="og:title"
    content="txtr"
>

<meta
    property="og:description"
    content="Extract and translate text from images."
>

<meta
    property="og:type"
    content="website"
>

<meta
    property="og:image"
    content="./icons/og-image.png"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="txtr"
>

<link
    rel="apple-touch-icon"
    href="./icons/icon-180.png"
>

<link rel="manifest" href="./manifest.json">

<title>txtr - OCR & Translation</title>  <style>
:root{
    --bg-main:#0a0a0a;
    --bg-card:#141414;
    --accent-cyan:#00d1ff;
    --text-primary:#ffffff;
    --text-secondary:#888888;
    --border-color:#222222;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:var(--bg-main);
    color:var(--text-primary);
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    position:relative;
}
h1 {color:#00d1ff;}
.shader-bg{
    position:absolute;
    inset:0;
    z-index:-1;
    opacity:.5;
}

.app-container{
    display:flex;
    flex-direction:column;
    width:100%;
    height:100%;
    max-width:480px;
    margin:0 auto;
    position:relative;
}

header{
    padding:1.5rem 1rem;
    border-bottom:1px solid var(--border-color);
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.header-content{

    display:flex;

    flex-direction:column;

    gap:.5rem;

}

.header-subtitle{

    color:var(--text-secondary);

    line-height:1.4;

    font-size:.85rem;

    max-width:32ch;

}
.logo-lockup{
    display:flex;
    align-items:center;
    gap:.75rem;
}

.logo-icon{

    width:32px;

    height:32px;

    background:var(--accent-cyan);

    border-radius:8px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:black;

    font-weight:900;

}

.logo-text{
    font-size:1.4rem;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-0.04em;
}

main{
    flex:1;
    overflow-y:auto;
    padding:1.5rem 1rem;
}

.app-view{
    display:none;
    flex-direction:column;
    gap:1.5rem;
    height:100%;
}

.app-view.active{
    display:flex;
}

.section-title{
    font-size:2.3rem;
    font-weight:900;
    font-style:italic;
    text-transform:uppercase;
    letter-spacing:-0.03em;
}

.section-subtitle{
    font-size:.75rem;
    color:var(--text-secondary);
    text-transform:uppercase;
    letter-spacing:.12em;
}

.card{
    background:var(--bg-card);
    border:1px solid var(--border-color);
    padding:1.5rem;
}

.card h3{
    margin-bottom:1rem;
    color:var(--accent-cyan);
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:.15em;
}

.button-group{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:1rem;
}

.button-group button{
    width:100%;
    min-width:0;
}

button{
    background:#1a1a1a;
    color:white;
    border:1px solid var(--border-color);
    padding:1rem;
    font-size:.8rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.05em;
    cursor:pointer;
    transition:.2s;
}

button:active{
    transform:scale(.98);
}

button.primary-glow{
    background:var(--accent-cyan);
    color:black;
    border:none;
}

button:disabled{
    opacity:.3;
    cursor:not-allowed;
}

.preview-container{
    width:100%;
    aspect-ratio:4/3;
    background:#000;
    border:1px solid var(--border-color);
    display:flex;
    justify-content:center;
    align-items:center;
}

#imagePreview{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

.status-banner{
    background:#111;
    color:var(--accent-cyan);
    padding:.8rem;
    border-left:3px solid var(--accent-cyan);
    font-size:.75rem;
    text-transform:uppercase;
    font-weight:800;
}

select,
textarea{
    width:100%;
    background:#111;
    border:1px solid var(--border-color);
    color:white;
    padding:1rem;
    outline:none;
}

textarea{
    flex:1;
        min-height:clamp(

        140px,

        35vh,

        320px

    );
    resize:none;
    font-family:monospace;
}

.select-wrapper{
    display:block;
}

.select-wrapper label{
    display:block;
    margin-bottom:.75rem;
    color:var(--text-secondary);
    text-transform:uppercase;
    font-size:.7rem;
    letter-spacing:.1em;
}

nav.tab-bar{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    background:#000;
    border-top:1px solid var(--border-color);
}

.tab-item{
    padding:1.25rem 0;
    text-align:center;
    font-size:.7rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:#444;
}

.tab-item.active{
    color:var(--accent-cyan);
}
input[type="file"]{
    display:none;
}
.hidden{
    display:none !important;
}
 @media (max-width:420px){

    .button-group{
        grid-template-columns:1fr;
    }

}   
    </style>
</head>
<body>
<span class="shader-bg"></span>
<div class="app-container">
<header>

    <div class="header-content">

        <div class="logo-lockup">

            <div class="logo-icon">
                T
            </div>

            <div class="logo-text">
                <h1>txtr</h1>
            </div>

        </div>

        <p class="header-subtitle">
            Text extract and translate from camera and documents
        </p>

    </div>

</header>

    <main>
        <!-- TAB 1: CAPTURE ENGINE -->
        <div id="view-capture" class="app-view active">
            <div class="card">
                <div class="button-group">
                    <button id="cameraButton">Use Camera</button>
                    <button id="uploadButton">Upload Image</button>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment">
                    <input type="file" id="fileInput" accept="image/*">
                </div>
            </div>

            <div class="preview-container">
                <img id="imagePreview" class="hidden" alt="Source Input Document">
                <div id="noPreview" style="color: var(--text-secondary); font-size: 0.9rem;">No image staged for extraction</div>
            </div>

            <div class="card">
                <div class="select-wrapper">
                    <label for="langSelect">Target Engine:</label>
                    <select id="langSelect">
                        <option value="eng">English Pack</option>
                        <option value="swe">Swedish Pack 🇸🇪</option>
                        <option value="est">Estonian Pack 🇪🇪</option>
                        <option value="nor">Norwegian Pack 🇳🇴 (Pro)</option>
                        <option value="dan">Danish Pack 🇩🇰 (Pro)</option>
                        <option value="fin">Finnish Pack 🇫🇮 (Pro)</option>
                    </select>
                </div>
                <div style="margin-top: 1rem;">
                    <button id="extractButton" class="primary-glow full-width" style="width:100%" disabled>Run Intelligent Extraction ⚡</button>
                </div>
            </div>
            <div id="status" class="status-banner hidden">System Idle...</div>
        </div>

        <!-- TAB 2: TEXT MANAGEMENT WORKSPACE -->
        <div id="view-edit" class="app-view">
            <textarea id="extractedText" placeholder="Extracted character sequence outputs will stream directly into this workspace..."></textarea>
            
            <div class="card">
                <h3>Optional Cleanup Tools</h3>
                <div class="button-group">
                    <button id="copyButton" class="primary-glow" onclick="copyToClipboard()" disabled>Copy Buffer</button>
                    <button onclick="manageText('stripJunk')" style="border-color: var(--accent-cyan);">✨ Strip Garbage Icons</button>
                    <button onclick="manageText('clean')">Normalize Whitespace</button>
                    <button onclick="manageText('uppercase')">UPPERCASE</button>
                    <button onclick="manageText('lowercase')">lowercase</button>
                    <button onclick="downloadText()">Export Plain Text</button>
                </div>
            </div>
        </div>

        <!-- TAB 3: TRANSLATION CORE -->
        <div id="view-translate" class="app-view">
            <div class="card">
                <h3>Translation Direct-Pass</h3>
                <p style="font-size:0.85rem; margin-bottom:1.2rem; color: var(--text-secondary); line-height: 1.4;"> Runs current workspace string fragments directly through the translation network layer.</p>
                <div class="button-group">
                    <button onclick="translateText(this, 'sv')">Convert to Swedish 🇸🇪</button>
                    <button onclick="translateText(this, 'et')">Convert to Estonian 🇪🇪</button>
                    <button onclick="translateText(this, 'en')">Convert to English 🇬🇧</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Rail Bar -->
    <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab('view-capture', this)">Capture Input</div>
        <div class="tab-item" onclick="switchTab('view-edit', this)">Edit Workspace</div>
        <div class="tab-item" onclick="switchTab('view-translate', this)">Translate</div>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const PRO_LANGS = ['nor', 'dan', 'fin'];
    let isProUser = localStorage.getItem('txtr_pro') === 'true';

    const cameraButton = document.getElementById('cameraButton');
    const uploadButton = document.getElementById('uploadButton');
    const cameraInput = document.getElementById('cameraInput');
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const noPreview = document.getElementById('noPreview');
    const extractButton = document.getElementById('extractButton');
    const statusDiv = document.getElementById('status');
    const extractedText = document.getElementById('extractedText');
    const copyButton = document.getElementById('copyButton');
    const langSelect = document.getElementById('langSelect');
    let currentImageSrc = null;

    window.switchTab = function(viewId, tabElement) {
        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        tabElement.classList.add('active');
    };

    function unlockPro() {
        localStorage.setItem('txtr_pro', 'true');
        isProUser = true;
        alert('✅ Premium Pack Extended Matrix Enabled!');
    }

    langSelect.addEventListener('change', (e) => {
        const selected = e.target.value;
        if (PRO_LANGS.includes(selected) && !isProUser) {
            const proceed = confirm(`⚠️ Premium Language Pack Selection\n\nUnlock extended architecture configurations for $3?`);
            if (proceed) { unlockPro(); } else { e.target.value = 'eng'; }
        }
    });

    cameraButton.addEventListener('click', () => cameraInput.click());
    uploadButton.addEventListener('click', () => fileInput.click());
    cameraInput.addEventListener('change', handleFile);
    fileInput.addEventListener('change', handleFile);

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            currentImageSrc = ev.target.result;
            imagePreview.src = currentImageSrc;
            imagePreview.classList.remove('hidden');
            noPreview.classList.add('hidden');
            extractButton.disabled = false;
        };
        reader.readAsDataURL(file);
    }

    // --- REVERTED BACK TO RAW DATA STREAM PASSTHROUGH FOR MAX ACCURACY ---
    async function extractText() {
        if (!currentImageSrc) return;
        const lang = langSelect.value;
        
        statusDiv.textContent = 'Spinning up extraction nodes...';
        statusDiv.classList.remove('hidden');
        extractButton.disabled = true;

        try {
            const { data: { text } } = await Tesseract.recognize(currentImageSrc, lang, {
                logger: m => {
                    if (m.status === 'recognizing text') {
                        statusDiv.textContent = `Analyzing Glyphs: ${Math.round(m.progress * 100)}%`;
                    }
                }
            });
            
            // Soft standard spacing normalization pass
            const normalizedText = text.replace(/\n\s*\n/g, '\n').trim();
            extractedText.value = normalizedText;
            copyButton.disabled = !normalizedText.trim();
            statusDiv.textContent = '🎉 Analysis Operational!';
            
            setTimeout(() => {
                statusDiv.classList.add('hidden');
                switchTab('view-edit', document.querySelectorAll('.tab-item')[1]);
            }, 900);

        } catch (err) {
            statusDiv.textContent = '❌ Engine Fault: ' + err.message;
        } finally {
            extractButton.disabled = false;
        }
    }
    extractButton.addEventListener('click', extractText);

    // --- NEW SMART TEXT CLEANERS ENGINE ---
    window.manageText = function(type) {
        let t = extractedText.value;
        if (!t) return;
        
        if (type === 'stripJunk') {
            // Targets junk artifacts generated by glare/background logos (e.g. ~, |, _, \, §, •, #)
            t = t.replace(/[\~§•°\|\_\\\/\{\}\[\]\^\#\=\+\*]/g, '');
            // Collapse messy multiple dashes or broken characters down safely
            t = t.replace(/\-{2,}/g, '-');
            // Trim messy trailing structural layout white noise safely
            t = t.split('\n').map(line => line.trim()).filter(line => line.length > 0).join('\n');
        }
        if (type === 'clean') {
            t = t.replace(/\n\s*\n/g, '\n').replace(/\s{2,}/g, ' ').trim();
        }
        if (type === 'uppercase') t = t.toUpperCase();
        if (type === 'lowercase') t = t.toLowerCase();
        
        extractedText.value = t;
    };

    window.copyToClipboard = function() {
        navigator.clipboard.writeText(extractedText.value);
        copyButton.textContent = 'Copied Successfully ✓';
        setTimeout(() => copyButton.textContent = 'Copy Buffer', 1500);
    }

    window.downloadText = function() {
        const blob = new Blob([extractedText.value], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'extracted_workspace.txt';
        a.click();
    };

    // --- TRANSLATION CONTEXT FIX ---
    window.translateText = async function(btnElement, targetLang) {
        let text = extractedText.value.trim();
        if (!text) return alert('No context currently loaded inside workspace.');

        let langPair = `en|${targetLang}`;
        if (targetLang === 'en') langPair = `auto|en`;

        if (text.length > 500) {
            text = text.slice(0, 500);
            alert('Notice: Transmitting maximum optimized 500 character frame package.');
        }

        statusDiv.textContent = 'Streaming packet to cloud translation network...';
        statusDiv.classList.remove('hidden');
        btnElement.disabled = true;
        
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`);
            const data = await res.json();
            if (data.responseData.translatedText) {
                extractedText.value = data.responseData.translatedText;
                statusDiv.textContent = '✅ Cloud Integration Synced!';
                setTimeout(() => {
                    statusDiv.classList.add('hidden');
                    switchTab('view-edit', document.querySelectorAll('.tab-item')[1]);
                }, 900);
            } else {
                statusDiv.textContent = '⚠️ Translation matrix execution breakdown.';
            }
        } catch (err) {
            statusDiv.textContent = '❌ Cloud Node Handshake Broken.';
        } finally {
            btnElement.disabled = false;
        }
    };

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
});
</script>
</body>
</html>
